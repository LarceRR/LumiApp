name: CI
on:
  push:
    branches: [master, main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: Мобильное приложение
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Линтер и формат
        run: npm run lint
      - name: Юнит-тесты
        run: npm test
      - name: Сборка бандла (Android)
        run: npx expo export --platform android --output-dir .expo/ci-android
      - name: Сборка бандла (iOS)
        run: npx expo export --platform ios --output-dir .expo/ci-ios
  api:
    name: Бэкенд
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lumi, POSTGRES_PASSWORD: lumi, POSTGRES_DB: lumi_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumi -d lumi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lumi:lumi@localhost:5432/lumi_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Линтер и формат
        run: npm run lint
      - name: Юнит-тесты
        run: npm test
      - name: Миграции на пустой БД
        run: npm run db:migrate
      - name: Контракт схемы после первого применения
        run: npm run db:verify
      - name: Повторные миграции на существующей БД
        run: npm run db:migrate
      - name: Контракт схемы после повторного применения
        run: npm run db:verify
      - name: Сборка
        run: npm run build
